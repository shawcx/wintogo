# Build the Debian package for a version tag (v0.1.0, ...) and publish it as
# a GitHub release. The tag must match the version in debian/changelog.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential debhelper dh-python python3

      - name: Check the tag matches debian/changelog
        run: |
          version=$(dpkg-parsechangelog -S Version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match debian/changelog ($version)"
            exit 1
          fi

      - name: Build the package
        run: |
          dpkg-buildpackage -b -us -uc
          mkdir dist
          mv ../wintogo_*_all.deb dist/

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.deb --verify-tag --generate-notes
